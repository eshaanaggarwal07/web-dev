<html>
    <head>
        <title>Marks legend</title>
    </head>
    <body>
        <p></p>
        <script>
             var marks = 50
                if (marks >= 90) {
                    document.write("A+ Grade")

                }
                else if (marks >= 70) {
                    document.write("B Grade")
                }
                else if (marks >= 45) {
                    document.write("C Grade")
                }
                else {
                    document.write("F Grade")
                }
            var i=2 
            while(i<= 14)
            {
                document.write(i)
                document.write("<br>")
                i=i+3
            }
        </script>
    </body>

</html>
