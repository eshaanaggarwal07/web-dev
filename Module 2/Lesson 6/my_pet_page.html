<html>
    <head>
        <style>
            body{
                background-color: rgb(252, 252, 196);
                font-family: Arial, Helvetica, sans-serif;
                    padding: 10px;
                    font-size: 20px;
                    text-align: center;
            }
            .pet{
                background-color: darkorange;
                color: white;
                position: fixed;
                top: 0;
                right: 0;
                left: 0;
                padding: 10px;
            }
            h1{
                color: darkorange;
            }
            h3{
                color: darkorange;
            }
            .static{
                border:3px solid darkorange ;
                background-color: white;
                margin: 3px;
                padding: 5px;
            }
            .month{
                background-color: darkorange;
                padding: 5px;
                position: relative;
                top:10px;
                left: 10px;
            }
            .static1{
                border:3px solid darkorange ;
                background-color: white;
                margin: 30px;
                padding: 100px;
                position: relative;
            }
            .button{
                background-color: green;
                width: fit-content;
                color: white;
                position:absolute;
                top: 5px;
                left: 800px;

            }
        </style>
    </head>
    <body>
        <div class="pet">
            My Pet Page- Buddy the Labrador
        </div><br>  
        <h1>Meet Buddy!</h1>
        <h3>
        Static
        </h3>
        <div class="static">
            Breed: Labrador
        </div>
        <div class="static">
            Age: 2 years old
        </div>
        <h3>
            Relative
        </h3>
        <p>This note shifts right from its normal spot.</p>
        <div class="Month">
            Pet of the Month!
        </div>
        <h3>Absolute</h3>
        <p>
            The badge is pinned to the corner of the card.
        </p>
        <div class="static1">
            Buddy - Labrador, 2 years
            <div class="button">
                Adopted!
            </div>
        </div>
        <h3>Style</h3>
    </body>
</html>
